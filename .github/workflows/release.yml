name: Release

on:
  push:
    branches:
      - main

# Permissions required for OIDC (npm trusted publishing).
permissions:
  id-token: write
  contents: read

jobs:
  build-and-release:
    name: 'Build project, run CI checks and publish new release'
    uses: fingerprintjs/dx-team-toolkit/.github/workflows/release-sdk-changesets.yml@v1
    with:
      client-id: ${{ vars.APP_CLIENT_ID }}
      runner-client-id: ${{ vars.RUNNER_APP_CLIENT_ID }}
      version-command: pnpm changeset:version
      publish-command: pnpm changeset:publish
      language: node
      language-version: 24
      prepare-command: pnpm test
      useTrustedPublishing: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      RUNNER_APP_PRIVATE_KEY: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
